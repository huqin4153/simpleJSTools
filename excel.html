<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excel / CSV SKU 分组统计与双重自然排序工具</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #e5e7eb;
      --success-bg: #ecfdf5;
      --success-text: #065f46;
      --error-bg: #fef2f2;
      --error-text: #991b1b;
      --group-bg: #f0f5ff;
      --multi-bg: #fff7ed;
      --multi-text: #9a3412;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .container {
      max-width: 1060px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }

    .header p {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: #f9fafb;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
    }

    input[type="file"],
    input[type="number"],
    select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font-size: 14px;
    }

    .threshold-combo {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .threshold-combo select {
      flex: 1.2;
      min-width: 110px;
    }

    .threshold-combo input[type="number"] {
      flex: 0.9;
      min-width: 84px;
    }

    .options-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--border);
      font-size: 13px;
      color: #374151;
    }

    .options-row label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .status.info {
      display: block;
      background: #eff6ff;
      color: #1e40af;
    }

    .status.success {
      display: block;
      background: var(--success-bg);
      color: var(--success-text);
    }

    .status.error {
      display: block;
      background: var(--error-bg);
      color: var(--error-text);
    }

    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 14px;
      font-size: 13px;
      color: var(--muted);
    }

    .summary strong {
      color: var(--text);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th,
    td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      background: #f9fafb;
      font-weight: 600;
      color: #374151;
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .group-row td {
      background: var(--group-bg);
      font-weight: 700;
      color: #1e3a8a;
      font-size: 13px;
    }

    .group-row.multi-hyphen td {
      background: var(--multi-bg);
      color: var(--multi-text);
    }

    .badge {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(37, 99, 235, 0.12);
      color: #1d4ed8;
    }

    .multi-hyphen .badge {
      background: rgba(154, 52, 18, 0.14);
      color: #9a3412;
    }

    .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: var(--primary);
    }

    .ratio-cell {
      min-width: 140px;
      font-variant-numeric: tabular-nums;
    }

    .ratio-text {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .ratio-bar-bg {
      width: 100%;
      height: 6px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
    }

    .ratio-bar-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 999px;
    }

    .empty-tip {
      text-align: center;
      padding: 28px 12px;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>Excel / CSV SKU 分组统计与双重自然排序</h1>
        <p>按单减号前缀分组 · 多个减号拉出单独排 · 支持最低数量筛选 · 组内：数量降序 → SKU 自然升序</p>
      </div>
      <button type="button" class="btn" id="loadSampleBtn">加载测试示例数据</button>
    </div>

    <div class="card">
      <div class="controls">
        <div class="field">
          <label for="fileInput">1. 选择表格文件（.xlsx / .xls / .csv）</label>
          <input type="file" id="fileInput" accept=".xlsx,.xls,.csv,text/csv" />
        </div>

        <div class="field">
          <label for="sheetSelect">2. 选择工作表（Sheet）</label>
          <select id="sheetSelect" disabled>
            <option value="">请先选择文件或加载示例</option>
          </select>
        </div>

        <div class="field">
          <label for="columnSelect">3. 选择统计分组列（如 SKU）</label>
          <select id="columnSelect" disabled>
            <option value="">请先选择工作表</option>
          </select>
        </div>

        <div class="field">
          <label for="minCountInput">4. 只看数量 ≥（下拉或手动输入）</label>
          <div class="threshold-combo">
            <select id="minCountPreset" aria-label="快捷数量阈值">
              <option value="0" selected>全部（≥ 0）</option>
              <option value="5">≥ 5</option>
              <option value="10">≥ 10</option>
              <option value="20">≥ 20</option>
              <option value="50">≥ 50</option>
              <option value="custom">自定义</option>
            </select>
            <input
              type="number"
              id="minCountInput"
              min="0"
              step="1"
              placeholder="输入数量"
              aria-label="手动输入最低数量"
            />
          </div>
        </div>

        <div class="field">
          <label for="multiPositionSelect">5. 多减号 SKU 放置位置</label>
          <select id="multiPositionSelect">
            <option value="last" selected>单独拉出，排在常规前缀组最后</option>
            <option value="first">单独拉出，排在常规前缀组最前</option>
          </select>
        </div>
      </div>

      <div class="options-row">
        <label>
          <input type="checkbox" id="ignoreEmptyRows" checked />
          跳过全空行
        </label>
        <label>
          <input type="checkbox" id="ignoreEmptyGroupVal" checked />
          跳过分组列为空的数据
        </label>
        <label>
          <input type="checkbox" id="trimValues" checked />
          去除首尾空格
        </label>
      </div>

      <div class="actions-row">
        <button type="button" class="btn btn-primary" id="runBtn" disabled>开始统计</button>
        <button type="button" class="btn" id="copyBtn" disabled>复制统计结果</button>
        <button type="button" class="btn" id="exportCsvBtn" disabled>导出统计 CSV</button>
      </div>

      <div id="statusBox" class="status"></div>
    </div>

    <div class="card">
      <div class="summary" id="summaryBar">
        <span>尚未执行统计</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width: 64px;">#</th>
              <th>SKU / 分组值</th>
              <th style="width: 110px; text-align: right;">数量</th>
              <th style="width: 180px;">占比（按有效总计）</th>
            </tr>
          </thead>
          <tbody id="resultTbody">
            <tr>
              <td colspan="4" class="empty-tip">选择文件或点击右上角“加载测试示例数据”查看结果</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
    // =========================================================================
    // 核心 1：自然排序拆分与比较器（A-12 < A-121，SL-6 < SL-7 < SL-27）
    // =========================================================================
    function splitNaturalTokens(str) {
      return String(str ?? "")
        .trim()
        .toLowerCase()
        .split(/(\d+)/)
        .filter((part) => part !== "")
        .map((part) => (/^\d+$/.test(part) ? Number(part) : part));
    }

    function compareNatural(a, b) {
      const ta = splitNaturalTokens(a);
      const tb = splitNaturalTokens(b);
      const maxLen = Math.max(ta.length, tb.length);

      for (let i = 0; i < maxLen; i++) {
        const x = ta[i];
        const y = tb[i];

        if (x === undefined) return -1;
        if (y === undefined) return 1;

        const xIsNum = typeof x === "number";
        const yIsNum = typeof y === "number";

        if (xIsNum && yIsNum) {
          if (x !== y) return x - y;
        } else if (!xIsNum && !yIsNum) {
          if (x !== y) return x < y ? -1 : 1;
        } else {
          return xIsNum ? -1 : 1;
        }
      }
      return 0;
    }

    // =========================================================================
    // 核心 2：按减号规则提取组别（多个减号拉出单独组，单个减号取前缀）
    // =========================================================================
    function classifySkuGroup(sku) {
      const val = String(sku ?? "").trim();
      const hyphenCount = (val.match(/-/g) || []).length;

      if (hyphenCount > 1) {
        return {
          groupKey: "__MULTI_HYPHEN__",
          groupLabel: "多减号 SKU（单独组）",
          isMultiHyphen: true
        };
      }

      if (hyphenCount === 1) {
        const prefix = val.split("-")[0].trim() || "未命名组";
        return {
          groupKey: prefix,
          groupLabel: `前缀组：${prefix}`,
          isMultiHyphen: false
        };
      }

      const alphaMatch = val.match(/^[A-Za-z\u4e00-\u9fa5]+/);
      if (alphaMatch) {
        const prefix = alphaMatch[0];
        return {
          groupKey: prefix,
          groupLabel: `前缀组：${prefix}`,
          isMultiHyphen: false
        };
      }

      return {
        groupKey: "__NO_HYPHEN_OTHER__",
        groupLabel: "其他 SKU（无减号）",
        isMultiHyphen: false
      };
    }

    // =========================================================================
    // 核心 3：最低数量筛选 + 组间排序 + 组内“数量降序 -> SKU 自然升序”
    // =========================================================================
    function getMinCountThreshold() {
      const raw = minCountInput.value.trim();
      if (raw === "") return 0;
      const num = Number(raw);
      if (Number.isNaN(num) || num < 0) return 0;
      return Math.floor(num);
    }

    function sortBySkuGroups(items, multiPosition = "last", minCount = 0) {
      const filteredItems =
        minCount > 0 ? items.filter((it) => it.count >= minCount) : [...items];

      const groupMap = new Map();

      for (const item of filteredItems) {
        const info = classifySkuGroup(item.key);
        if (!groupMap.has(info.groupKey)) {
          groupMap.set(info.groupKey, {
            groupKey: info.groupKey,
            groupLabel: info.groupLabel,
            isMultiHyphen: info.isMultiHyphen,
            items: []
          });
        }
        groupMap.get(info.groupKey).items.push(item);
      }

      const groups = Array.from(groupMap.values());

      groups.sort((ga, gb) => {
        if (ga.isMultiHyphen !== gb.isMultiHyphen) {
          if (multiPosition === "first") {
            return ga.isMultiHyphen ? -1 : 1;
          }
          return ga.isMultiHyphen ? 1 : -1;
        }
        if (ga.isMultiHyphen && gb.isMultiHyphen) {
          return 0;
        }
        return compareNatural(ga.groupLabel, gb.groupLabel);
      });

      for (const g of groups) {
        g.items.sort((a, b) => {
          if (b.count !== a.count) return b.count - a.count;
          return compareNatural(a.key, b.key);
        });
      }

      return {
        groups,
        filteredSkuCount: filteredItems.length
      };
    }

    // =========================================================================
    // 内置 CSV 兜底解析
    // =========================================================================
    function parseSimpleCsvTo2D(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let inQuotes = false;

      const normalized = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
      for (let i = 0; i < normalized.length; i++) {
        const ch = normalized[i];
        const next = normalized[i + 1];

        if (ch === '"') {
          if (inQuotes && next === '"') {
            cell += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === "," && !inQuotes) {
          row.push(cell);
          cell = "";
        } else if (ch === "\n" && !inQuotes) {
          row.push(cell);
          rows.push(row);
          row = [];
          cell = "";
        } else {
          cell += ch;
        }
      }
      if (cell.length > 0 || row.length > 0) {
        row.push(cell);
        rows.push(row);
      }
      return rows;
    }

    // =========================================================================
    // 状态管理与 DOM 引用
    // =========================================================================
    const state = {
      workbookData: {},
      currentSheet: "",
      headers: [],
      lastResult: null
    };

    const fileInput = document.getElementById("fileInput");
    const sheetSelect = document.getElementById("sheetSelect");
    const columnSelect = document.getElementById("columnSelect");
    const minCountPreset = document.getElementById("minCountPreset");
    const minCountInput = document.getElementById("minCountInput");
    const multiPositionSelect = document.getElementById("multiPositionSelect");
    const ignoreEmptyRowsEl = document.getElementById("ignoreEmptyRows");
    const ignoreEmptyGroupValEl = document.getElementById("ignoreEmptyGroupVal");
    const trimValuesEl = document.getElementById("trimValues");

    const loadSampleBtn = document.getElementById("loadSampleBtn");
    const runBtn = document.getElementById("runBtn");
    const copyBtn = document.getElementById("copyBtn");
    const exportCsvBtn = document.getElementById("exportCsvBtn");
    const statusBox = document.getElementById("statusBox");
    const summaryBar = document.getElementById("summaryBar");
    const resultTbody = document.getElementById("resultTbody");

    function setStatus(type, msg) {
      statusBox.className = `status ${type}`;
      statusBox.textContent = msg;
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function initWorkbook(sheetMap, sourceLabel) {
      const sheetNames = Object.keys(sheetMap);
      if (!sheetNames.length) {
        throw new Error("未在表格中找到任何有效工作表（Sheet）。");
      }

      state.workbookData = sheetMap;
      state.lastResult = null;

      sheetSelect.innerHTML = sheetNames
        .map((name) => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`)
        .join("");
      sheetSelect.disabled = false;

      onSheetChange(sheetNames[0]);
      setStatus("success", `已加载「${sourceLabel}」，共 ${sheetNames.length} 个工作表。`);
    }

    function onSheetChange(sheetName) {
      state.currentSheet = sheetName;
      const rawRows = state.workbookData[sheetName] || [];

      let headerRowIdx = -1;
      for (let i = 0; i < rawRows.length; i++) {
        const r = rawRows[i] || [];
        if (r.some((cell) => String(cell ?? "").trim() !== "")) {
          headerRowIdx = i;
          break;
        }
      }

      if (headerRowIdx === -1) {
        state.headers = [];
        columnSelect.innerHTML = `<option value="">当前工作表为空</option>`;
        columnSelect.disabled = true;
        runBtn.disabled = true;
        return;
      }

      const headerRow = rawRows[headerRowIdx];
      state.headers = headerRow.map((h, idx) => {
        const text = String(h ?? "").trim();
        return text || `第${idx + 1}列`;
      });

      columnSelect.innerHTML = state.headers
        .map((h, idx) => `<option value="${idx}">${escapeHtml(h)}（列 ${idx + 1}）</option>`)
        .join("");
      columnSelect.disabled = false;
      runBtn.disabled = false;
    }

    // =========================================================================
    // 去空行、统计、最低数量筛选与渲染
    // =========================================================================
    function runAnalysis() {
      try {
        const sheetName = state.currentSheet;
        const rawRows = state.workbookData[sheetName];
        if (!rawRows || !rawRows.length) {
          throw new Error("当前工作表没有可统计的数据。");
        }

        const colIdx = Number(columnSelect.value);
        if (Number.isNaN(colIdx) || colIdx < 0) {
          throw new Error("请选择有效的分组列。");
        }

        const minCount = getMinCountThreshold();
        const multiPosition = multiPositionSelect.value;
        const skipEmptyRows = ignoreEmptyRowsEl.checked;
        const skipEmptyGroup = ignoreEmptyGroupValEl.checked;
        const shouldTrim = trimValuesEl.checked;

        let headerRowIdx = rawRows.findIndex((r) =>
          (r || []).some((cell) => String(cell ?? "").trim() !== "")
        );
        if (headerRowIdx === -1) headerRowIdx = 0;

        const dataRows = rawRows.slice(headerRowIdx + 1);
        const countMap = new Map();
        let totalValidRows = 0;
        let skippedEmptyRows = 0;

        for (const row of dataRows) {
          const cells = Array.isArray(row) ? row : [];
          const isAllEmpty = cells.every((c) => String(c ?? "").trim() === "");

          if (isAllEmpty) {
            if (skipEmptyRows) {
              skippedEmptyRows++;
              continue;
            }
          }

          let rawVal = cells[colIdx];
          let key = rawVal === undefined || rawVal === null ? "" : String(rawVal);
          if (shouldTrim) {
            key = key.trim();
          }

          if (key === "" && skipEmptyGroup) {
            continue;
          }

          const displayKey = key === "" ? "(空值)" : key;
          countMap.set(displayKey, (countMap.get(displayKey) || 0) + 1);
          totalValidRows++;
        }

        const rawItems = Array.from(countMap.entries()).map(([key, count]) => ({
          key,
          count
        }));

        const { groups, filteredSkuCount } = sortBySkuGroups(
          rawItems,
          multiPosition,
          minCount
        );

        state.lastResult = {
          sheetName,
          columnName: state.headers[colIdx] || `列 ${colIdx + 1}`,
          minCount,
          multiPosition,
          totalValidRows,
          skippedEmptyRows,
          totalSkuCount: rawItems.length,
          filteredSkuCount,
          groups
        };

        renderResults(state.lastResult);
        copyBtn.disabled = filteredSkuCount === 0;
        exportCsvBtn.disabled = filteredSkuCount === 0;

        const filterDesc = minCount > 0 ? `（仅显示数量 ≥ ${minCount}）` : "";
        setStatus(
          "success",
          `统计完成${filterDesc}：显示 ${filteredSkuCount} / ${rawItems.length} 个 SKU，共 ${groups.length} 个组（有效记录 ${totalValidRows} 条，跳过空行 ${skippedEmptyRows} 行）。`
        );
      } catch (err) {
        setStatus("error", `统计失败：${err && err.message ? err.message : String(err)}`);
      }
    }

    function renderResults(result) {
      const {
        sheetName,
        columnName,
        minCount,
        totalValidRows,
        skippedEmptyRows,
        totalSkuCount,
        filteredSkuCount,
        groups
      } = result;

      summaryBar.innerHTML = `
        <span>工作表：<strong>${escapeHtml(sheetName)}</strong></span>
        <span>分组列：<strong>${escapeHtml(columnName)}</strong></span>
        <span>数量条件：<strong>${minCount > 0 ? `≥ ${minCount}` : "全部"}</strong></span>
        <span>显示 SKU：<strong>${filteredSkuCount} / ${totalSkuCount}</strong></span>
        <span>组别数：<strong>${groups.length}</strong></span>
        <span>有效总计：<strong>${totalValidRows}</strong></span>
        <span>跳过空行：<strong>${skippedEmptyRows}</strong></span>
      `;

      if (!groups.length) {
        const emptyMsg =
          minCount > 0
            ? `没有数量 ≥ ${minCount} 的 SKU 数据，请调低数量阈值或选择“全部”`
            : "没有符合条件的统计数据";
        resultTbody.innerHTML = `
          <tr>
            <td colspan="4" class="empty-tip">${escapeHtml(emptyMsg)}</td>
          </tr>
        `;
        return;
      }

      let seq = 0;
      const htmlParts = [];

      for (const g of groups) {
        const groupTotalCount = g.items.reduce((acc, it) => acc + it.count, 0);
        const rowClass = g.isMultiHyphen ? "group-row multi-hyphen" : "group-row";
        const tagText = g.isMultiHyphen ? "多减号单独组" : `${g.items.length} 个 SKU`;

        htmlParts.push(`
          <tr class="${rowClass}">
            <td colspan="4">
              ${escapeHtml(g.groupLabel)}
              <span class="badge">${escapeHtml(tagText)} · 组内合计 ${groupTotalCount}</span>
            </td>
          </tr>
        `);

        for (const item of g.items) {
          seq++;
          const pct = totalValidRows > 0 ? (item.count / totalValidRows) * 100 : 0;
          const pctText = `${pct.toFixed(2)}%`;
          htmlParts.push(`
            <tr>
              <td>${seq}</td>
              <td>${escapeHtml(item.key)}</td>
              <td class="num">${item.count}</td>
              <td class="ratio-cell">
                <div class="ratio-text">${pctText}</div>
                <div class="ratio-bar-bg">
                  <div class="ratio-bar-fill" style="width: ${Math.min(100, pct).toFixed(2)}%;"></div>
                </div>
              </td>
            </tr>
          `);
        }
      }

      resultTbody.innerHTML = htmlParts.join("");
    }

    // =========================================================================
    // 复制与导出 CSV
    // =========================================================================
    function formatResultAsTsv(result) {
      const lines = ["序号\t组别\tSKU / 分组值\t数量\t占比"];
      let seq = 0;
      for (const g of result.groups) {
        for (const item of g.items) {
          seq++;
          const pct = result.totalValidRows > 0
            ? ((item.count / result.totalValidRows) * 100).toFixed(2) + "%"
            : "0.00%";
          lines.push(`${seq}\t${g.groupLabel}\t${item.key}\t${item.count}\t${pct}`);
        }
      }
      return lines.join("\n");
    }

    async function copyResultText() {
      if (!state.lastResult || !state.lastResult.groups.length) return;
      const text = formatResultAsTsv(state.lastResult);
      try {
        await navigator.clipboard.writeText(text);
        setStatus("success", "已复制统计结果到剪贴板。");
      } catch (_) {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        setStatus("success", "已复制统计结果到剪贴板。");
      }
    }

    function exportResultCsv() {
      if (!state.lastResult || !state.lastResult.groups.length) return;
      const escapeCsv = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const rows = [["序号", "组别", "SKU / 分组值", "数量", "占比"]];
      let seq = 0;
      for (const g of state.lastResult.groups) {
        for (const item of g.items) {
          seq++;
          const pct = state.lastResult.totalValidRows > 0
            ? ((item.count / state.lastResult.totalValidRows) * 100).toFixed(2) + "%"
            : "0.00%";
          rows.push([seq, g.groupLabel, item.key, item.count, pct]);
        }
      }
      const csvContent = "\uFEFF" + rows.map((r) => r.map(escapeCsv).join(",")).join("\r\n");
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const suffix = state.lastResult.minCount > 0 ? `_数量大于等于${state.lastResult.minCount}` : "";
      a.href = url;
      a.download = `${state.lastResult.sheetName}_${state.lastResult.columnName}${suffix}_SKU分组统计.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setStatus("success", "已导出统计结果 CSV 文件。");
    }

    // =========================================================================
    // 快捷下拉与手动输入框联动
    // =========================================================================
    minCountPreset.addEventListener("change", () => {
      const val = minCountPreset.value;
      if (val === "custom") {
        minCountInput.focus();
        return;
      }
      minCountInput.value = val === "0" ? "" : val;
      if (state.lastResult) runAnalysis();
    });

    minCountInput.addEventListener("input", () => {
      const cleaned = minCountInput.value.trim();
      const presetValues = ["5", "10", "20", "50"];
      if (cleaned === "" || cleaned === "0") {
        minCountPreset.value = "0";
      } else if (presetValues.includes(cleaned)) {
        minCountPreset.value = cleaned;
      } else {
        minCountPreset.value = "custom";
      }
      if (state.lastResult) runAnalysis();
    });

    // =========================================================================
    // 文件上传与测试示例数据
    // =========================================================================
    fileInput.addEventListener("change", async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      try {
        setStatus("info", `正在读取文件「${file.name}」...`);
        const lowerName = file.name.toLowerCase();

        if (typeof XLSX !== "undefined") {
          const buffer = await file.arrayBuffer();
          const wb = XLSX.read(buffer, { type: "array" });
          const sheetMap = {};
          wb.SheetNames.forEach((name) => {
            sheetMap[name] = XLSX.utils.sheet_to_json(wb.Sheets[name], {
              header: 1,
              raw: false,
              defval: ""
            });
          });
          initWorkbook(sheetMap, file.name);
        } else if (lowerName.endsWith(".csv")) {
          const text = await file.text();
          initWorkbook({ Sheet1: parseSimpleCsvTo2D(text) }, file.name);
        } else {
          throw new Error("当前未加载 Excel 解析库（XLSX），且非 .csv 文件。请联网打开页面或选择 .csv 文件。");
        }

        runAnalysis();
      } catch (err) {
        setStatus("error", `表格解析失败：${err && err.message ? err.message : String(err)}`);
      }
    });

    loadSampleBtn.addEventListener("click", () => {
      const sampleRows = [["SKU"]];
      const pushMany = (sku, n) => {
        for (let i = 0; i < n; i++) sampleRows.push([sku]);
      };

      pushMany("XL-20", 29);
      pushMany("XL-77", 17);
      pushMany("XL-97", 17);
      pushMany("XL-4", 4);

      pushMany("SL-33", 22);
      pushMany("SL-6", 18);
      pushMany("SL-7", 18);
      pushMany("SL-27", 18);
      pushMany("SL-8", 8);

      pushMany("A-2", 5);
      pushMany("A-12", 5);
      pushMany("A-121", 5);
      pushMany("A-1", 1);

      pushMany("XL-A-12", 14);
      pushMany("XL-A-2", 14);
      pushMany("SL-B-9", 9);

      sampleRows.push([""]);
      sampleRows.push([null]);

      initWorkbook({ 示例明细: sampleRows }, "内置测试示例");
      runAnalysis();
    });

    sheetSelect.addEventListener("change", (e) => {
      onSheetChange(e.target.value);
      runAnalysis();
    });

    columnSelect.addEventListener("change", runAnalysis);
    multiPositionSelect.addEventListener("change", () => {
      if (state.lastResult) runAnalysis();
    });

    [ignoreEmptyRowsEl, ignoreEmptyGroupValEl, trimValuesEl].forEach((el) => {
      el.addEventListener("change", () => {
        if (state.lastResult) runAnalysis();
      });
    });

    runBtn.addEventListener("click", runAnalysis);
    copyBtn.addEventListener("click", copyResultText);
    exportCsvBtn.addEventListener("click", exportResultCsv);
  </script>
</body>
</html>
